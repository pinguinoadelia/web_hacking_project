<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PHOTOS photographers website">
  <title>Reset password · PHOTOS</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
    <div class="container navbar">
        <a class="brand" href="index.html" aria-label="PHOTOS home"><span class="brand-mark" aria-hidden="true"></span>PHOTOS</a>
        <nav class="nav-links" aria-label="Primary navigation">
            <a data-nav-auth href="gallery.html">Gallery</a>
            <a data-nav-auth class="nav-essential" href="upload.html">Upload</a>
            <a data-nav-auth href="account.html">Account</a>
            <a data-nav-admin href="admin.html">Admin</a>
            <span data-nav-auth class="nav-user"><span class="avatar" data-current-initials>?</span><span data-current-username></span></span>
            <button data-nav-auth data-logout type="button">Logout</button>
            <a data-nav-guest href="login.html">Login</a>
            <a data-nav-guest class="nav-essential btn btn--primary" href="register.html">Register</a>
        </nav>
    </div>
</header>  
<main id="main" class="page page--centered">
    <div class="container">
        <section class="auth-shell card auth-card" aria-labelledby="reset-title">
            <p class="eyebrow">Account recovery</p>
            <h1 id="reset-title">Choose a new password</h1>
            <div id="reset-error" class="notice notice--danger" role="alert" hidden></div>
            <div id="reset-success" class="notice notice--success" role="status" hidden>Password changed. <a class="link" href="login.html">Return to login</a>.</div>
            <form id="reset-form" class="form">
                <div class="form-row">
                    <label for="password">New password</label>
                    <input class="input" id="password" name="password" type="password" autocomplete="new-password" required>
                </div>
                <div class="form-row">
                    <label for="confirm-password">Confirm new password</label>
                    <input class="input" id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required>
                </div>
                <button class="btn btn--primary" type="submit">Change password</button>
            </form>
        </section>
    </div>
</main>
<footer class="site-footer">
    <div class="container footer-inner">
        <span>© <span data-year></span> PHOTOS · Photographers Webseite</span>
    </div>
</footer>
<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
