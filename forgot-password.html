<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recover password · PHOTOS</title>
    <link rel="stylesheet" href="css/styles.css">
</head> 
<body class="">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
    <div class="container navbar">
        <a class="brand" href="index.html" aria-label="PHOTOS home"><span class="brand-mark" aria-hidden="True"></span>PHOTOS</a>
        <nav class="nav-links" aria-label="Primary navigation">
            <a data-nav-auth href="gallery.html">Gallery</a>
            <a data-nav-auth class="nav-essential" href="upload.html">Upload</a>
            <a data-nav-auth href="account.html">Account</a>
            <a data-nav-auth href="admin.html">Admin</a>
            <span data-nav-auth class="nav-user"><span class="avatar" data-current-initials>?</span><span data-current-username></span></span>
            <button data-nav-auth data-logout type="button">Logout</button>
            <a data-nav-guest href="login.html">Login</a>
            <a data-nav-guest class="nav-essential btn btn--primary" href="register.html">Register</a>
        </nav>
    </div>
</header>
<main id="main" class="page page--centered">
    <div class="container">
        <section class="auth-shell card auth-card" aria-labelledby="forgot-title">
            <p class="eyebrow">Account recovery</p>
            <h1 id="forgot-title">Forgot password?</h1>
            <p>Enter your username</p>
            <div id="forgot-success" class="notice notice--success" role="status" hidden></div>
            <form id="forgot-form" class="form">
                <div class="form-row">
                    <label for="username">Username</label>
                    <input class="input" id="username" name="username" autocomplete="username" required>
                </div>
                <button class="btn btn--primary" type="submit">Recover account</button>
            </form>
            <p><a id="reset-link" class="link" href="reset-password.html" hidden>Continue</a></p>
        </section>
    </div>
</main>
<footer class="site-footer">
    <div class="container footer-inner">
        <span>© <span data-year></span> PHOTOS · Photographers Website</span>
    </div>
</footer>
<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>    
</body>
</html>
